name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bouwen-en-testen:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Herstellen
        run: dotnet restore

      - name: Bouwen (waarschuwingen = fouten)
        run: dotnet build --no-restore --configuration Release

      # UI-tests (FlaUI) vereisen een interactieve sessie en draaien lokaal; zie README.
      - name: Testen
        run: dotnet test --no-build --configuration Release --filter "Categorie!=UI" --logger trx --results-directory TestResults

      - name: Testresultaten bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testresultaten
          path: TestResults

  # Fase 7: de database-beveiliging (Row-Level Security) tegen een echte PostgreSQL en de webapp.
  webapp-en-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Beveiligingstests database en Edge Function
        working-directory: supabase/tests
        env:
          PG_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          npm ci
          npx vitest run

      - name: Webapp installeren
        working-directory: webapp
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Webapp kwetsbaarheden (alleen wat bij de gebruiker komt)
        working-directory: webapp
        run: npm audit --omit=dev --audit-level=high

      - name: Webapp controleren en testen
        working-directory: webapp
        run: |
          npm run check
          npm test
          npm run test:e2e
