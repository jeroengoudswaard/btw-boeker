name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bouwen-en-testen:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Herstellen
        run: dotnet restore

      - name: Bouwen (waarschuwingen = fouten)
        run: dotnet build --no-restore --configuration Release

      # UI-tests (FlaUI) vereisen een interactieve sessie en draaien lokaal; zie README.
      - name: Testen
        run: dotnet test --no-build --configuration Release --filter "Categorie!=UI" --logger trx --results-directory TestResults

      - name: Testresultaten bewaren
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testresultaten
          path: TestResults
