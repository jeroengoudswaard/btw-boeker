<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F3F3F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0E10" media="(prefers-color-scheme: dark)" />
    <!-- Besluit 254: op GitHub Pages kunnen geen HTTP-koppen worden gezet; deze CSP staat daarom in de pagina.
         frame-ancestors en Permissions-Policy werken niet via <meta> (wel via static/_headers op Cloudflare). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' __CSP_SERVER__; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'self'; object-src 'none'" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="icon" href="%sveltekit.assets%/icoon-192.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icoon-192.png" />
    <title>Verenigd · leiding</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="off">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
